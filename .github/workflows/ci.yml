name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (production deps, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate app manifests
        run: npm run check:manifests
      - name: Typecheck and build all eight apps for one origin
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-site
          path: site
          retention-days: 14
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
