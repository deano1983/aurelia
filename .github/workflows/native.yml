name: Build Sideloadable Android APKs & iOS Projects

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - 00-central-hub
          - 01-daily-command-timeline
          - 02-cross-cloud-asset-vault
          - 03-voice-authority-studio
          - 04-ctl-encrypted-relay
          - 05-glowgrid-creator-radar
          - 06-expense-tax-invoice
          - 07-distribution-affiliate-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies & build web bundle
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci --prefix ../..
          npm run build
          npx cap sync android

      - name: Build sideloadable APK (Debug + Release)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload Sideloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-sideload-apk
          path: |
            apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
            apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
